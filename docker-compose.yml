services:
  db:
    image: postgres:16-alpine
    container_name: ganttpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ganttpro
      POSTGRES_PASSWORD: ganttpro
      POSTGRES_DB: ganttpro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ganttpro-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganttpro -d ganttpro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ganttpro-pgdata:
