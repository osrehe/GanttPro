name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://ganttpro:ganttpro@localhost:5432/ganttpro?schema=public
  DATABASE_URL_TEST: postgresql://ganttpro:ganttpro@localhost:5432/ganttpro_test?schema=public
  AUTH_SECRET: ci-secret-no-usar-en-produccion-0123456789
  AUTH_TRUST_HOST: "true"
  SEED_PASSWORD: GanttPro2026!

jobs:
  verificar:
    name: Lint, tipos, unit e integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ganttpro
          POSTGRES_PASSWORD: ganttpro
          POSTGRES_DB: ganttpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ganttpro -d ganttpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: psql postgresql://ganttpro:ganttpro@localhost:5432/ganttpro -c "CREATE DATABASE ganttpro_test OWNER ganttpro;"
      - run: npx cross-env DATABASE_URL="$DATABASE_URL_TEST" prisma migrate deploy
      - run: npm run test

  e2e:
    name: Migración, seed, build y e2e
    runs-on: ubuntu-latest
    needs: verificar
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ganttpro
          POSTGRES_PASSWORD: ganttpro
          POSTGRES_DB: ganttpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ganttpro -d ganttpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      # Chromium para Puppeteer (exportación a PDF); npm ci puede no ejecutar el script de descarga.
      - run: npx puppeteer browsers install chrome
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run db:seed:perf
      - run: npm run test:e2e:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  imagen:
    name: Construcción de la imagen de producción
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Solo se construye: publicar la imagen es decisión del despliegue, no de CI.
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ganttpro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tamaño de la imagen
        run: docker image ls ganttpro:ci --format "{{.Repository}}:{{.Tag}} {{.Size}}"
